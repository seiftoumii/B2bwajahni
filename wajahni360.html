      .w360-wheel-explore:hover span { background: #f56e14; transform: translateY(3px); }
      /* The Figma exports are presented as a deliberate visual deck: each panel owns a screen instead of following another flat image. */
      .w360-section { position: relative; display: grid; place-items: center; isolation: isolate; width: 100%; min-height: 100svh; padding: 112px 30px 36px; overflow: hidden; background: #10295f; opacity: 1; transform: none; scroll-snap-align: start; scroll-snap-stop: always; }
      .w360-section::before { position: absolute; z-index: -2; inset: -48px; content: ''; background-image: var(--panel-image); background-position: center; background-size: cover; filter: blur(32px) saturate(.86) brightness(.68); opacity: .64; transform: scale(1.09); }
      .w360-section::after { position: absolute; z-index: -1; inset: 0; content: ''; background: radial-gradient(circle at 14% 88%, rgba(246,110,20,.5), transparent 36%), radial-gradient(circle at 88% 11%, rgba(48,110,218,.42), transparent 34%), linear-gradient(120deg, rgba(8,35,91,.9), rgba(14,50,120,.56) 51%, rgba(237,78,23,.48)); pointer-events: none; }

      /* Final website-flow overrides: no deck framing, no slide sizing, no image treatment. */
      .w360-section { display: block; width: 100%; min-height: 0; padding: 0; overflow: visible; background: #fff; opacity: 1 !important; transform: none !important; scroll-snap-align: none; }
      .w360-section::before, .w360-section::after { display: none; }
      .w360-section img { position: static; display: block; width: 100%; height: auto; max-width: none; max-height: none; border: 0; border-radius: 0; box-shadow: none; object-fit: initial; transform: none !important; transition: none; }

        margin-top: calc(-1 * var(--w3-ov));
